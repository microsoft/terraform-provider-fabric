kind: added
body: |
  Added `configuration.local_time_zone_id` attribute to the `fabric_item_job_scheduler` resource and data-sources.
  The attribute accepts a [Windows time zone identifier](https://learn.microsoft.com/windows-hardware/manufacture/desktop/default-time-zones). When not set, the service-side default is used.
