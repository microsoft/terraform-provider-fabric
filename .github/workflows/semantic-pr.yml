# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Linter to enforce semantic pull request titles (see https://www.conventionalcommits.org/)
---
name: 🔍 Semantic PR

on:
  pull_request:
    branches: ["main"]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  pull-requests: read

jobs:
  main:
    name: 🔍 Check PR title
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Run Semantic PR validation
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
